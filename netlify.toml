[build]
  command = "npm run build:client"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  # Absolute URL of the live Render backend — baked into the client bundle at
  # build time since Netlify (a static host) has no dev-server proxy for /api/*.
  VITE_API_BASE_URL = "https://wishnest-backend-mjpa.onrender.com"

# Proxy /api/* to the Render backend so the deployed frontend can still call
# it same-origin if VITE_API_BASE_URL isn't set for some reason (belt & suspenders).
[[redirects]]
  from = "/api/*"
  to = "https://wishnest-backend-mjpa.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (wouter) resolve on hard refresh/deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
